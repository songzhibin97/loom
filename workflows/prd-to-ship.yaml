name: prd-to-ship
description: 一句需求 → PRD → TRD → 实现 → 测试 → 多视角 review → 提交。
version: 1

inputs:
  - name: requirement
    description: 一句话原始需求
    required: true

start: gather_requirements

states:

  # ============================================================
  # Phase 1 — 需求澄清 + PRD
  # ============================================================

  gather_requirements:
    kind: skill
    skill: prd-clarify
    on_pass: draft_prd
    on_fail: gather_requirements
    max_attempts: 2
    on_exceed: escalate_requirement

  draft_prd:
    kind: skill
    skill: prd-author
    on_pass: review_prd_gate
    on_fail: draft_prd
    max_attempts: 3
    on_exceed: escalate_requirement

  review_prd_gate:
    kind: gate
    prompt: |
      PRD 草稿已生成（artifacts/PRD.md）。
        - approve            采用，进入 TRD
        - revise <反馈>      回去改 PRD
        - back               退回需求澄清
        - abort              终止
    routes:
      approve: draft_trd
      revise:  draft_prd
      back:    gather_requirements
      abort:   _abort
    feedback_artifact: artifacts/PRD_feedback.md

  # ============================================================
  # Phase 2 — TRD
  # ============================================================

  draft_trd:
    kind: skill
    skill: trd-author
    on_pass: review_trd_gate
    on_fail: draft_trd
    max_attempts: 3
    on_exceed: escalate_trd

  review_trd_gate:
    kind: gate
    prompt: |
      TRD 草稿已生成（artifacts/TRD.md）。
        - approve            采用，进入实现
        - revise <反馈>      回去改 TRD
        - back               退回 PRD
        - abort              终止
    routes:
      approve: implement
      revise:  draft_trd
      back:    draft_prd
      abort:   _abort
    feedback_artifact: artifacts/TRD_feedback.md

  # ============================================================
  # Phase 3 — 实现 → 独立写测试 → 真跑 → 变异验证
  # ============================================================

  implement:
    kind: skill
    skill: implement                # 只写实现代码，不写测试
    on_pass: author_tests
    on_fail: implement
    max_attempts: 3
    on_exceed: escalate_trd

  author_tests:
    kind: skill
    skill: author-invariant-tests   # 独立测试作者：只看 PRD/TRD，看不到实现
    on_pass: run_invariant_tests
    on_fail: author_tests
    max_attempts: 3
    on_exceed: escalate_trd

  run_invariant_tests:
    kind: skill
    skill: test-runner              # 真跑契约套件 -race，逐不变量对照
    on_pass: mutation_verify
    on_fail: implement              # 不变量测试挂 → 实现偏离规格，回 implement
    max_attempts: 3
    on_exceed: escalate_trd

  mutation_verify:
    kind: skill
    skill: mutation-verify          # 改坏 enforce 代码，确认 hard 不变量测试会变红
    on_pass: code_review
    on_fail: author_tests           # 测试没牙 → 回去重写测试
    max_attempts: 2
    on_exceed: escalate_trd

  # ============================================================
  # Phase 4 — 并行静态 review（次级；主拦截在 Phase 3）
  # ============================================================

  code_review:
    kind: parallel
    fan_out:
      - skill: reviewer-quality     # 质量 + 完整性 + stub + 断言强度
      - skill: reviewer-security    # 安全
    aggregator: review-aggregator
    shared_inputs:
      - { name: diff, path: artifacts/diff.patch }
      - { name: trd,  path: artifacts/TRD.md }
      - { name: prd,  path: artifacts/PRD.md }
    on_pass: commit
    on_fail: implement
    max_attempts: 2
    on_exceed: escalate_trd

  # ============================================================
  # Phase 5 — 提交
  # ============================================================

  commit:
    kind: skill
    skill: committer
    on_pass: done
    on_fail: commit
    max_attempts: 2
    on_exceed: escalate_commit

  done:
    kind: terminal
    summary: |
      跑完 prd-to-ship。
      产出：artifacts/PRD.md, artifacts/TRD.md, artifacts/diff.patch,
            artifacts/test_manifest.md, artifacts/reviews/mutation.md,
            artifacts/review_verdict.md
      历史与诊断见 history。

  # ============================================================
  # Escalation states
  # ============================================================

  escalate_requirement:
    kind: human
    diagnosis: |
      在 PRD/澄清 阶段反复失败。多半是原始需求本身不清楚或不一致。
    prompt: |
      需求阶段卡住。下一步：
        1) 我手动修改 artifacts/PRD.md，然后 resume
        2) 重新输入需求，从头开始
        3) 终止
    routes:
      "1": _resume_after_manual
      "2": gather_requirements
      "3": _abort

  escalate_trd:
    kind: human
    diagnosis: |
      在 实现/测试/review 阶段反复失败。多半是 TRD 设计有问题——
      可能模块拆分不合理、接口不够完整、或漏掉了边界条件。
    prompt: |
      技术方案疑似走不通。下一步：
        1) 回到 TRD 重新设计 (draft_trd)
        2) 回到 PRD 重新审视需求 (draft_prd)
        3) 我手动改 artifacts/，你 resume
        4) 终止
    routes:
      "1": draft_trd
      "2": draft_prd
      "3": _resume_after_manual
      "4": _abort

  escalate_commit:
    kind: human
    diagnosis: |
      代码 review 通过但 commit 失败。多半是 git/远端权限或冲突。
    prompt: |
      提交失败。下一步：
        1) 我手动处理，你 resume
        2) 终止
    routes:
      "1": _resume_after_manual
      "2": _abort
